# SILP — پیکربندی Nginx (PRD §12.1، NFR-03)
# این فایل در M7-17 با دامنه و گواهی واقعی تکمیل می‌شود.

# محدودیت نرخ لبه — لایهٔ دوم پس از محدودیت نرخ اپ (§5.1).
limit_req_zone $binary_remote_addr zone=silp_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=silp_api:10m rate=300r/m;

upstream silp_api {
    server api:8000;
    keepalive 32;
}

upstream silp_web {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── هدرهای امنیتی — NFR-03 ──────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.silp.ir; font-src 'self'; connect-src 'self' https://api.silp.ir; frame-ancestors 'none'; base-uri 'self'" always;

    server_tokens off;
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── IP واقعی کاربر ──────────────────────────────────────────────
    # هدر ورودی بازنویسی می‌شود تا کلاینت نتواند آن را جعل کند و
    # محدودیت نرخ به‌ازای IP را دور بزند.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    # ── سلامت ───────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://silp_api;
        access_log off;
    }

    # ── احراز هویت: محدودیت سخت‌تر ──────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=silp_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://silp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=silp_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://silp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # SSE مرکز اعلان (§5.10) نباید بافر شود.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ── دارایی‌های ایستا ────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://silp_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        proxy_pass http://silp_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://silp_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
