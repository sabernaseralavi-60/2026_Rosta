# SILP — Prometheus — NFR-14، NFR-15، M7-17
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    system: silp

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # API — چهار کارگر uvicorn، یک /metrics (حالت چندفرایندی).
  - job_name: api
    metrics_path: /metrics
    # اگر METRICS_TOKEN در .env تنظیم شده، همان مقدار در این فایل:
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]

  # کارگر ARQ — هر نسخه پورت ۹۱۰۱ خودش را دارد؛ DNS داخلی داکر برای سرویس
  # چندنسخه‌ای همهٔ نشانی‌ها را برمی‌گرداند.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101

  # میزبان: دیسک، حافظه — و فایل‌های معیار پشتیبان‌گیری.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
