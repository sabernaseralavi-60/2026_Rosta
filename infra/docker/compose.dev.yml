# SILP — پشتهٔ توسعه (PRD §12.3)
# اجرا از ریشهٔ مخزن: docker compose -f infra/docker/compose.dev.yml up
name: silp-dev

x-api-base: &api-base
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
    target: dev
  env_file: ../../.env
  environment:
    PYTHONPATH: /app/apps/api/src
    PYTHONUNBUFFERED: "1"
  volumes:
    - ../../apps/api:/app/apps/api
    - ../../infra:/app/infra
    - ../../packages:/app/packages
    # کتابخانهٔ دروس (ADR-0008) — `make courses-sync` از همین می‌خواند.
    # فقط-خواندنی: همگام‌سازی هرگز فایل کاربر را عوض نمی‌کند، جز
    # `course.yml` که با `--no-manifest` می‌توان نوشتنش را هم بست.
    - ../../Courses:/app/Courses
    - api-venv:/app/.venv
  working_dir: /app/apps/api
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ── دادهٔ پایدار ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-silp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silp}
      POSTGRES_DB: ${POSTGRES_DB:-silp}
      # مقایسهٔ متن فارسی درست و قطعی
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=fa-IR --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-silp} -d ${POSTGRES_DB:-silp}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-silpminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-silpminio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # سطل توسعه را یک‌بار می‌سازد و خارج می‌شود.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-silpminio} ${S3_SECRET_KEY:-silpminio} &&
      mc mb --ignore-existing local/${S3_BUCKET:-silp-dev} &&
      echo 'سطل MinIO آماده است.'
      "
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # ── اپلیکیشن ──────────────────────────────────────────────────────────
  api:
    <<: *api-base
    command: >
      uvicorn silp.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/apps/api/src
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *api-base
    command: arq silp.workers.settings.WorkerSettings --watch /app/apps/api/src
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file: ../../.env
    environment:
      # مرورگر از localhost صدا می‌زند، رندر سمت سرور از شبکهٔ Docker.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000/api/v1}
      WATCHPACK_POLLING: "true"
    command: pnpm --filter web dev
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/web/src:/app/apps/web/src
      - ../../apps/web/public:/app/apps/web/public
      - ../../packages:/app/packages
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  api-venv: {}
