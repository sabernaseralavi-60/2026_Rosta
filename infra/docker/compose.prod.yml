# SILP — پشتهٔ تولید، یک سرور (فاز ۱) — PRD §12.5، ADR-0001، ADR-0018
#
# اجرا از ریشهٔ مخزن:
#   VERSION=<sha> docker compose -f infra/docker/compose.prod.yml --env-file .env up -d
# معمولاً از راه infra/scripts/deploy.sh، نه دستی.
#
# هیچ پورتی جز ۸۰ و ۴۴۳ منتشر نمی‌شود. Prometheus و Alertmanager فقط روی
# 127.0.0.1 گوش می‌دهند؛ از راه تونل SSH دیده می‌شوند (docs/ops/runbook.md).
#
# Docker Hub از ایران مسدود است؛ daemon.json سرور باید آینهٔ رجیستری (مثلاً
# آینهٔ ابر آروان) داشته باشد — فهرست بررسی راه‌اندازی در runbook.
name: silp

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-api-env: &api-env
  env_file: ../../.env
  environment:
    ENVIRONMENT: production
    PYTHONPATH: /app/apps/api/src

services:
  # ── لبه ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    <<: [*restart, *logging]
    ports: ["80:80", "443:443"]
    environment:
      SILP_DOMAIN: ${SILP_DOMAIN:?SILP_DOMAIN را در .env بگذارید}
      # مبدأ فضای ذخیره‌سازی برای CSP — بارگذاری مستقیم مرورگر به S3 (M3).
      SILP_S3_ORIGIN: ${SILP_S3_ORIGIN:?SILP_S3_ORIGIN را در .env بگذارید}
    volumes:
      # قالب‌ها با envsubst تصویر nginx پر می‌شوند؛ فقط متغیرهای محیطی بالا
      # جایگزین می‌شوند و متغیرهای خود nginx ($host، $remote_addr) دست نمی‌خورند.
      - ../nginx/templates:/etc/nginx/templates:ro
      # پیکربندی پیش‌فرض تصویر برای هر نام میزبانی پاسخ می‌داد.
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  certbot:
    image: certbot/certbot:v2.11.0
    <<: [*restart, *logging]
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # تمدید روزی دو بار تلاش می‌شود؛ certbot فقط گواهی نزدیک به انقضا را
    # تمدید می‌کند. بارگذاری دوبارهٔ nginx کار deploy.sh / cron میزبان است.
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'

  # ── اپ ─────────────────────────────────────────────────────────────────
  api:
    image: silp/api:${VERSION:?VERSION را بدهید}
    <<: [*restart, *logging, *api-env]
    environment:
      ENVIRONMENT: production
      PYTHONPATH: /app/apps/api/src
      # حالت چندفرایندی معیارها — چهار کارگر uvicorn یک /metrics دارند.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    command: >
      sh -c 'rm -rf /tmp/prometheus && mkdir -p /tmp/prometheus &&
      exec uvicorn silp.main:app --host 0.0.0.0 --port 8000 --workers 4
      --proxy-headers --forwarded-allow-ips="*"'
    volumes:
      - ../../Courses:/app/Courses:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources: { limits: { memory: 2G } }

  worker:
    image: silp/api:${VERSION}
    <<: [*restart, *logging, *api-env]
    command: arq silp.workers.settings.WorkerSettings
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    deploy:
      # §12.5 دو کارگر می‌خواست؛ هر کار cron در ARQ «یکتا»ست، پس دو نمونه
      # یک نوبت را دو بار اجرا نمی‌کنند و یکی جای دیگری را می‌گیرد.
      replicas: 2
      resources: { limits: { memory: 1G } }

  web:
    image: silp/web:${VERSION}
    <<: [*restart, *logging]
    environment:
      # رندر سمت سرور صفحهٔ اصلی و نیمرخ عمومی مستقیم به API می‌رود، نه از
      # راه nginx و اینترنت.
      INTERNAL_API_URL: http://api:8000/api/v1
    depends_on:
      api: { condition: service_healthy }

  # ── داده ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-silp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در .env بگذارید}
      POSTGRES_DB: ${POSTGRES_DB:-silp}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=fa-IR --encoding=UTF8"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # archive_command در /backups/wal می‌نویسد.
      - backups:/backups
    shm_size: 256m
    depends_on:
      init-backups: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes: [redisdata:/data]

  # فقط وقتی ذخیره‌سازی ابری (آروان) در دسترس نیست:
  #   docker compose --profile minio ...
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: [minio]
    <<: [*restart, *logging]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]

  # ── پشتیبان‌گیری — NFR-10 ──────────────────────────────────────────────
  # حجم /backups را ریشه می‌سازد؛ postgres و backup هر دو با کاربر ۷۰ (postgres
  # در ایمیج alpine) در آن می‌نویسند.
  init-backups:
    image: alpine:3.20
    command: sh -c 'mkdir -p /backups/wal /backups/metrics /backups/logical /backups/base && chown -R 70:70 /backups'
    volumes: [backups:/backups]

  backup:
    image: silp/backup:${VERSION}
    build:
      context: ../..
      dockerfile: infra/docker/backup.Dockerfile
    <<: [*restart, *logging]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-silp}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-silp}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes: [backups:/backups]
    depends_on:
      postgres: { condition: service_healthy }

  # ── رصد — NFR-14، NFR-15 ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    <<: [*restart, *logging]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=:9090
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../monitoring/secrets:/etc/prometheus/secrets:ro
      - prometheusdata:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    <<: [*restart, *logging]
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../monitoring/secrets:/etc/alertmanager/secrets:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    <<: [*restart, *logging]
    command:
      - --path.rootfs=/host
      # فایل‌های معیار backup.sh و basebackup.sh — هشدار شکست پشتیبان.
      - --collector.textfile.directory=/backups/metrics
    pid: host
    volumes:
      - /:/host:ro,rslave
      - backups:/backups:ro

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  backups: {}
  certbot-certs: {}
  certbot-www: {}
  prometheusdata: {}
