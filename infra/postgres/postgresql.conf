# SILP — PostgreSQL تولید، سرور فاز ۱ (۴ هسته، ۸GB) — PRD §12.5، NFR-10، M7-17
#
# فقط آنچه با پیش‌فرض فرق دارد. پیش‌فرض داکر listen_addresses='*' است؛ اینجا
# صریح نوشته شده چون با mount کردن این فایل، پیش‌فرض تصویر کنار می‌رود.

listen_addresses = '*'
max_connections = 100              # API ۴ کارگر × ۲۰ + کارگرها + پشتیبان‌گیری
hba_file = '/etc/postgresql/pg_hba.conf'

# ── حافظه ───────────────────────────────────────────────────────────
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 16MB

# ── دیسک SSD ────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200

# ── WAL و بایگانی — NFR-09 (RPO ۱۵ دقیقه) و NFR-10 ──────────────────
# `replica` برای pg_basebackup و بازیابی نقطه‌ای لازم است.
wal_level = replica
max_wal_senders = 3
archive_mode = on
# بایگانی در حجم /backups که کانتینر پشتیبان‌گیری هم می‌بیند و هر ۵ دقیقه
# به فضای ابری جدا می‌فرستد. `test ! -f` بازنویسی فایل موجود را رد می‌کند:
# بازنویسی بی‌صدای WAL یعنی زنجیرهٔ بازیابی شکسته‌ای که کسی نمی‌فهمد.
archive_command = 'test ! -f /backups/wal/%f && cp %p /backups/wal/%f'
# بدون این، در ساعت کم‌ترافیک یک فایل WAL ساعت‌ها پر نمی‌شود و بایگانی
# نمی‌شود — RPO عملاً چند ساعت می‌شد، نه ۱۵ دقیقه.
archive_timeout = 900
max_wal_size = 2GB
min_wal_size = 256MB

# ── مهلت‌ها — NFR-11 ────────────────────────────────────────────────
# سقف کوئری اپ از DB_STATEMENT_TIMEOUT_MS می‌آید؛ این فقط تراکنش رهاشده را می‌بندد.
idle_in_transaction_session_timeout = 60s

# ── رصد ─────────────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
log_min_duration_statement = 1000   # کوئری‌های کندتر از ۱ ثانیه
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_timezone = 'Asia/Tehran'
timezone = 'UTC'
