syllabus:
- week: 1
  title_fa: داده‌کاوی و یادگیری ماشین در عمران
  objectives:
  - تفاوت آمار کلاسیک و یادگیری ماشین
  - نمونه‌های کاربردی در حمل‌ونقل و سازه
- week: 2
  title_fa: محیط کار
  objectives:
  - پایتون، نوت‌بوک و محیط مجازی
  - کنترل نسخه و پژوهش تکرارپذیر
- week: 3
  title_fa: آماده‌سازی داده
  objectives:
  - دادهٔ گمشده و پرت
  - مقیاس‌بندی و کدگذاری متغیر کیفی
- week: 4
  title_fa: تحلیل اکتشافی
  objectives:
  - آمار توصیفی و همبستگی
  - مصورسازی مؤثر
- week: 5
  title_fa: رگرسیون خطی
  objectives:
  - برآورد و تفسیر ضرایب
  - منظم‌سازی ریج و لاسو
- week: 6
  title_fa: رگرسیون لجستیک و ارزیابی
  objectives:
  - ماتریس درهم‌ریختگی
  - ROC، AUC و انتخاب آستانه
- week: 7
  title_fa: درخت تصمیم و جنگل تصادفی
  objectives:
  - معیار تقسیم و هرس
  - اهمیت ویژگی
- week: 8
  title_fa: گرادیان بوستینگ
  objectives:
  - XGBoost و LightGBM
  - تنظیم ابرپارامترهای کلیدی
- week: 9
  title_fa: آزمون میان‌ترم و کارگاه
  objectives:
  - جمع‌بندی مدل‌های نظارت‌شده
- week: 10
  title_fa: SVM و KNN
  objectives:
  - حاشیه و کرنل
  - فاصله و انتخاب k
- week: 11
  title_fa: اعتبارسنجی و بیش‌برازش
  objectives:
  - اعتبارسنجی متقابل
  - جستجوی شبکه‌ای و بیزی
- week: 12
  title_fa: خوشه‌بندی
  objectives:
  - k-means و انتخاب k
  - سلسله‌مراتبی و DBSCAN
- week: 13
  title_fa: کاهش بعد
  objectives:
  - PCA
  - t-SNE و UMAP برای مصورسازی
- week: 14
  title_fa: سری زمانی
  objectives:
  - مؤلفه‌های روند و فصلی
  - پیش‌بینی تقاضای سفر
- week: 15
  title_fa: شبکهٔ عصبی
  objectives:
  - پرسپترون چندلایه
  - مقدمهٔ یادگیری عمیق
- week: 16
  title_fa: تفسیرپذیری مدل
  objectives:
  - SHAP و وابستگی جزئی
  - چرا مدل جعبه‌سیاه در مهندسی خطرناک است
- week: 17
  title_fa: ارائهٔ پروژه
  objectives:
  - ارائهٔ پروژهٔ داده‌کاوی روی دادهٔ واقعی
