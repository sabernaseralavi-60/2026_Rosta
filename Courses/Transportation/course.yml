# مانیفست درس — SILP (ADR-0008)
# این فایل را آزادانه ویرایش کنید. هر فایلی که در این پوشه
# بگذارید و اینجا نامش نباشد، هنگام همگام‌سازی خودکار افزوده
# می‌شود؛ ویرایش این فایل فقط حدسِ سامانه را دقیق‌تر می‌کند.
#
# access_tier: PUBLIC (برای همه) | SUBSCRIBER (دانشجوی درس رایگان،
#              بقیه با اشتراک) | ENROLLED (فقط دانشجوی درس)

code: TRANSPORT-ENG
slug: transportation-engineering
title_fa: مهندسی ترابری
title_en: Transportation Engineering
degree_level: BACHELOR
credits: 3
is_public: true
default_access_tier: SUBSCRIBER
description: 'درس پایهٔ ترابری: از مشخصات راننده و وسیله تا جریان ترافیک، ظرفیت، سطح سرویس
  و طراحی تقاطع. در نیمهٔ دوم، همان مفاهیم در یک شبیه‌ساز واقعی آزموده می‌شوند.'
topics:
- جریان ترافیک
- ظرفیت و سطح سرویس
- تقاطع
- حمل‌ونقل همگانی
materials:
- file: SUMO.docx
  kind: BOOK
  title_fa: مهندسی شبیه‌سازی ترافیک با SUMO
  description: کتاب «مهندسی شبیه‌سازی ترافیک با SUMO» — از ساخت شبکه با netconvert و netedit
    تا تقاضا، چراغ راهنمایی، TraCI، یادگیری تقویتی و داشبورد. سی فصل در هشت بخش.
  authors:
  - مؤلف
  - اکرم مظاهری
  edition: ۱۴۰۵
  weeks:
  - 14
  - 15
  section: بخش اول و دوم — فصل ۱ تا ۸
syllabus:
- week: 1
  title_fa: سامانهٔ حمل‌ونقل و اجزای آن
  objectives:
  - نقش ترابری در اقتصاد و زندگی شهری
  - شاخص‌های عملکرد سامانه
- week: 2
  title_fa: راننده، وسیله و راه
  objectives:
  - زمان واکنش و فاصلهٔ دید
  - مشخصات هندسی راه
- week: 3
  title_fa: متغیرهای جریان ترافیک
  objectives:
  - حجم، سرعت و تراکم
  - روش‌های اندازه‌گیری میدانی
- week: 4
  title_fa: رابطهٔ بنیادی جریان
  objectives:
  - نمودار جریان-تراکم-سرعت
  - نمودار بنیادی ماکروسکوپیک
- week: 5
  title_fa: مدل‌های خردنگر
  objectives:
  - تعقیب خودرو
  - تغییر خط و پذیرش فاصله
- week: 6
  title_fa: نظریهٔ صف در ترابری
  objectives:
  - مدل‌های صف و تأخیر
  - تحلیل صف پشت چراغ
- week: 7
  title_fa: ظرفیت و سطح سرویس راه
  objectives:
  - راه‌های چندخطه و آزادراه
  - محاسبهٔ سطح سرویس
- week: 8
  title_fa: ظرفیت تقاطع‌ها
  objectives:
  - تقاطع چراغ‌دار و بدون چراغ
  - تأخیر کنترل
- week: 9
  title_fa: آزمون میان‌ترم
  objectives:
  - جمع‌بندی مباحث جریان و ظرفیت
- week: 10
  title_fa: زمان‌بندی چراغ راهنمایی
  objectives:
  - فازبندی و زمان تلف‌شده
  - روش وبستر
- week: 11
  title_fa: میدان‌ها و تقاطع‌های بدون چراغ
  objectives:
  - ظرفیت میدان
  - کنترل با تابلوی ایست
- week: 12
  title_fa: پارکینگ و مدیریت تقاضا
  objectives:
  - برآورد نیاز پارکینگ
  - سیاست‌های قیمت‌گذاری
- week: 13
  title_fa: حمل‌ونقل همگانی
  objectives:
  - مسیر، سرفاصله و اندازهٔ ناوگان
  - شاخص‌های کیفیت خدمت
- week: 14
  title_fa: مقدمهٔ شبیه‌سازی با SUMO
  objectives:
  - اجزای یک سناریوی شبیه‌سازی
  - نصب و اولین اجرا
- week: 15
  title_fa: ساخت شبکه از OSM
  objectives:
  - netconvert و اصلاح شبکه
  - اجرای سناریو و خواندن خروجی
- week: 16
  title_fa: ایمنی، محیط‌زیست و انرژی
  objectives:
  - شاخص‌های ایمنی راه
  - آلودگی و مصرف سوخت
- week: 17
  title_fa: ارائهٔ پروژه
  objectives:
  - ارائهٔ تحلیل یک تقاطع واقعی
