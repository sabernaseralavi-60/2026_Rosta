syllabus:
- week: 1
  title_fa: مفاهیم ایمنی راه
  objectives:
  - بار اجتماعی و اقتصادی تصادفات
  - رویکرد سامانهٔ ایمن
- week: 2
  title_fa: داده‌های تصادف
  objectives:
  - منابع داده در ایران
  - کم‌گزارشی و سوگیری داده
- week: 3
  title_fa: کیفیت و آماده‌سازی داده
  objectives:
  - تطبیق مکانی تصادف با شبکه
  - پاک‌سازی و یکپارچه‌سازی
- week: 4
  title_fa: شاخص‌های ایمنی
  objectives:
  - نرخ تصادف بر حسب تردد
  - مقایسهٔ مقاطع و محورها
- week: 5
  title_fa: مدل‌های شمارشی
  objectives:
  - رگرسیون پواسون
  - دوجمله‌ای منفی و بیش‌پراکندگی
- week: 6
  title_fa: مدل پیش‌بینی ایمنی
  objectives:
  - تابع SPF و متغیرهای آن
  - کاربرد در راهنمای HSM
- week: 7
  title_fa: روش تجربی بیز
  objectives:
  - بازگشت به میانگین
  - ترکیب مشاهده و پیش‌بینی
- week: 8
  title_fa: شناسایی نقاط پرتصادف
  objectives:
  - روش‌های رتبه‌بندی
  - مقایسهٔ روش‌ها و خطای هر کدام
- week: 9
  title_fa: آزمون میان‌ترم
  objectives:
  - جمع‌بندی مدل‌سازی آماری
- week: 10
  title_fa: ممیزی ایمنی راه
  objectives:
  - مراحل RSA
  - چک‌لیست بازرسی
- week: 11
  title_fa: اقدامات اصلاحی و CMF
  objectives:
  - بانک ضرایب اصلاح تصادف
  - انتخاب اقدام بر پایهٔ شواهد
- week: 12
  title_fa: ارزیابی اثربخشی
  objectives:
  - طرح قبل-بعد
  - گروه شاهد و تصحیح روند
- week: 13
  title_fa: تحلیل شدت تصادف
  objectives:
  - لوجیت ترتیبی
  - پروبیت و مدل‌های نامرتب
- week: 14
  title_fa: شاخص‌های جانشین ایمنی
  objectives:
  - TTC، PET و DRAC
  - چرا SSM وقتی تصادف کم است
- week: 15
  title_fa: استخراج SSM از شبیه‌سازی
  objectives:
  - خروجی SUMO و ابزار SSM
  - کالیبراسیون رفتاری
- week: 16
  title_fa: کاربران آسیب‌پذیر
  objectives:
  - ایمنی عابر و موتورسیکلت
  - طراحی برای سرعت پایین
- week: 17
  title_fa: ارائهٔ پروژه
  objectives:
  - ارائهٔ تحلیل ایمنی یک محور واقعی
