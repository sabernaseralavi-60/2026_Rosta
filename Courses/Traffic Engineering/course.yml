syllabus:
- week: 1
  title_fa: شبیه‌سازی ترافیک در عصر هوش مصنوعی
  objectives:
  - جایگاه SUMO میان ابزارهای شبیه‌سازی
  - چرا متن‌باز و خط‌فرمان
- week: 2
  title_fa: اکوسیستم ابزارهای SUMO
  objectives:
  - netconvert، netedit، duarouter، sumo-gui
  - نقش هر ابزار در گردش‌کار
- week: 3
  title_fa: 'پروژهٔ سریع: یک چهارراه واقعی'
  objectives:
  - از OSM تا اجرای شبیه‌سازی
  - کمتر از یک جلسه تا اولین خروجی
- week: 4
  title_fa: فرمت‌های XML سومو
  objectives:
  - شبکه، مسیر، تنظیمات و افزونه
  - خواندن و ویرایش دستی فایل‌ها
- week: 5
  title_fa: ساخت شبکه با netconvert
  objectives:
  - تبدیل OSM و Shapefile
  - پاک‌سازی و ساده‌سازی شبکه
- week: 6
  title_fa: کار با netedit
  objectives:
  - ترسیم گره و لبه
  - ویرایش اتصالات خط‌به‌خط
- week: 7
  title_fa: هندسهٔ میدان، دوربرگردان و رمپ
  objectives:
  - مدل‌سازی میدان
  - رمپ ورودی و خروجی بزرگراه
- week: 8
  title_fa: مدل‌سازی چندوجهی
  objectives:
  - عابر پیاده و دوچرخه
  - خطوط اتوبوس و ایستگاه
- week: 9
  title_fa: میان‌ترم و تحویل شبکه
  objectives:
  - ارائهٔ شبکهٔ محدودهٔ انتخابی
  - راستی‌آزمایی با Google، نشان و بلد
- week: 10
  title_fa: تولید تقاضا
  objectives:
  - randomTrips.py
  - تعریف جریان‌های متوالی
- week: 11
  title_fa: ماتریس مبدأ-مقصد و TAZ
  objectives:
  - od2trips
  - مدل‌سازی نواحی ترافیکی
- week: 12
  title_fa: مسیریابی
  objectives:
  - duarouter و تعادل پویا
  - jtrrouter و درصد گردش
- week: 13
  title_fa: کلاس وسیله و فیزیک حرکت
  objectives:
  - vType و پارامترهای رفتاری
  - خودروی خودران و کاروان
- week: 14
  title_fa: کنترل چراغ راهنمایی
  objectives:
  - فازبندی زمان‌ثابت
  - کنترل Actuated
- week: 15
  title_fa: سنسورها و خروجی‌ها
  objectives:
  - لوپ دتکتور E1، سنسور ناحیه‌ای E2 و مسیر E3
  - استخراج داده به Pandas
- week: 16
  title_fa: برنامه‌نویسی با TraCI و libsumo
  objectives:
  - معماری سوکت TraCI
  - کنترل پویای چراغ با پایتون
- week: 17
  title_fa: پروژهٔ نهایی
  objectives:
  - سناریوسازی و مقایسهٔ گزینه‌ها
  - گزارش مدیریتی و داشبورد
