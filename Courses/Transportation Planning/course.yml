# مانیفست درس — SILP (ADR-0008)
# این فایل را آزادانه ویرایش کنید. هر فایلی که در این پوشه
# بگذارید و اینجا نامش نباشد، هنگام همگام‌سازی خودکار افزوده
# می‌شود؛ ویرایش این فایل فقط حدسِ سامانه را دقیق‌تر می‌کند.
#
# access_tier: PUBLIC (برای همه) | SUBSCRIBER (دانشجوی درس رایگان،
#              بقیه با اشتراک) | ENROLLED (فقط دانشجوی درس)

code: TRANSPORT-PLAN
slug: transportation-planning
title_fa: برنامه‌ریزی حمل‌ونقل
title_en: Transportation Planning
degree_level: MASTER
credits: 3
is_public: true
default_access_tier: SUBSCRIBER
description: 'از داده تا تصمیم: مدل چهارمرحله‌ای تقاضای سفر، کالیبراسیون، تخصیص ترافیک و ارزیابی
  اقتصادی طرح‌ها. خروجی درس یک مطالعهٔ موردی واقعی روی یک محدودهٔ شهری است.'
topics:
- تقاضای سفر
- مدل چهارمرحله‌ای
- ماتریس مبدأ-مقصد
- تخصیص ترافیک
- سیاست‌گذاری
materials:
- file: سوال چهارگزینه ایmtp .docx
  kind: QUESTION_BANK
  title_fa: بانک سؤال چهارگزینه‌ای برنامه‌ریزی حمل‌ونقل
  description: سؤالات مرور و آمادگی آزمون، به تفکیک فصل.
  access_tier: ENROLLED
  weeks:
  - 9
  - 17
syllabus:
- week: 1
  title_fa: مقدمه‌ای بر برنامه‌ریزی حمل‌ونقل
  objectives:
  - جایگاه برنامه‌ریزی حمل‌ونقل در توسعهٔ شهری
  - 'چرخهٔ برنامه‌ریزی: مسئله، گزینه، ارزیابی، تصمیم'
- week: 2
  title_fa: داده‌های حمل‌ونقل
  objectives:
  - پیمایش خانوار، آمارگیری مبدأ-مقصد، شمارش حجم
  - 'منابع دادهٔ نوین: موبایل، GPS، کارت بلیت'
- week: 3
  title_fa: نواحی ترافیکی و کاربری زمین
  objectives:
  - تعریف TAZ و قواعد ناحیه‌بندی
  - پیوند کاربری زمین با تولید سفر
- week: 4
  title_fa: مدل چهارمرحله‌ای — نمای کلی
  objectives:
  - چهار مرحله و ترتیبشان
  - مفروضات و محدودیت‌های اساسی مدل
- week: 5
  title_fa: تولید سفر
  objectives:
  - تولید و جذب سفر، متغیرهای توضیحی
  - تفکیک سفر بر حسب هدف
- week: 6
  title_fa: روش‌های تولید سفر
  objectives:
  - رگرسیون چندمتغیره
  - طبقه‌بندی متقاطع و نرخ سفرسازی
- week: 7
  title_fa: توزیع سفر و مدل جاذبه
  objectives:
  - ساختار مدل جاذبه و تابع اصطکاک
  - روش فراتور و توازن سطری-ستونی
- week: 8
  title_fa: کالیبراسیون و ماتریس مبدأ-مقصد
  objectives:
  - برآورد ماتریس OD از شمارش
  - ارزیابی برازش مدل
- week: 9
  title_fa: آزمون میان‌ترم و کارگاه داده
  objectives:
  - جمع‌بندی مراحل اول و دوم
  - کار عملی با دادهٔ واقعی
- week: 10
  title_fa: تفکیک وسیله
  objectives:
  - عوامل مؤثر بر انتخاب وسیله
  - مطلوبیت و سهم وسیله
- week: 11
  title_fa: مدل‌های انتخاب گسسته
  objectives:
  - لوجیت چندگانه
  - لوجیت لانه‌ای و مسئلهٔ IIA
- week: 12
  title_fa: تخصیص ترافیک
  objectives:
  - تعادل کاربر و بهینهٔ سیستم
  - تخصیص افزایشی و تعادلی
- week: 13
  title_fa: تخصیص با نرم‌افزار
  objectives:
  - اجرای تخصیص روی شبکهٔ واقعی
  - تفسیر خروجی و اعتبارسنجی
- week: 14
  title_fa: ارزیابی اقتصادی طرح‌ها
  objectives:
  - تحلیل هزینه-فایده
  - ارزش زمان و صرفه‌جویی سفر
- week: 15
  title_fa: حمل‌ونقل همگانی و فعال
  objectives:
  - برنامه‌ریزی شبکهٔ اتوبوس و BRT
  - پیاده و دوچرخه در مدل تقاضا
- week: 16
  title_fa: حمل‌ونقل پایدار و سیاست‌گذاری
  objectives:
  - تقاضای القایی
  - ابزارهای مدیریت تقاضا
- week: 17
  title_fa: ارائهٔ پروژهٔ پایانی
  objectives:
  - ارائهٔ مطالعهٔ موردی
  - نقد و جمع‌بندی درس
