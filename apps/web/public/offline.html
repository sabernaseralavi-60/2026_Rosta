<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#008374" />
    <title>آفلاین — سیلپ</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --fg: #1c1b19;
        --muted: #57534e;
        --brand: #006d60;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1b19;
          --fg: #f5f5f4;
          --muted: #a8a29e;
          --brand: #4fd1c0;
        }
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: Vazirmatn, Tahoma, 'Segoe UI', sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        padding: 24px 16px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        color: var(--brand);
      }
      p {
        margin: 0;
        max-width: 32ch;
        line-height: 1.9;
        text-wrap: balance;
        color: var(--muted);
      }
      button {
        justify-self: center;
        margin-top: 8px;
        padding: 10px 22px;
        font: inherit;
        color: #fff;
        background: #006d60;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main id="main">
      <h1>اتصال اینترنت نیست</h1>
      <p>
        سیلپ برای نشان‌دادن اطلاعات تو به اینترنت نیاز دارد. اتصالت را بررسی کن و دوباره امتحان کن.
      </p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
