[project]
name = "silp-api"
version = "0.1.0"
description = "SABER Innovation & Learning Platform — API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.32.0,<0.33",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30.0,<0.31",
  "alembic>=1.14.0,<1.15",
  "redis>=5.2.0,<6",
  "arq>=0.26.0,<0.27",
  "argon2-cffi>=23.1.0,<24",
  "bcrypt>=4.2.0,<5",
  "pyjwt>=2.9.0,<3",
  "httpx>=0.27.0,<0.28",
  "structlog>=24.4.0,<25",
  "python-slugify>=8.0.4,<9",
  "boto3>=1.35.0,<2",
  "python-multipart>=0.0.12,<0.1",
  # ADR-0008 — مانیفست پوشهٔ درس (`course.yml`).
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<0.25",
  "pytest-cov>=6.0.0,<7",
  "hypothesis>=6.115.0,<7",
  "ruff>=0.7.0,<0.8",
  "mypy>=1.13.0,<2",
  "types-python-slugify>=8.0.2",
  "boto3-stubs[s3]>=1.35.0",
  "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silp"]

# ── ruff ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "C4",          # comprehensions
  "DTZ",         # datetime بدون منطقهٔ زمانی — D-12
  "S",           # bandit
  "T20",         # print
  "RUF",
  "ASYNC",
  "BLE",       # except بدون نوع
  "PLW0603",   # دستکاری متغیر سراسری
]
ignore = [
  "S101",   # assert در تست‌ها لازم است
  "RUF001", # کاراکترهای شبیه‌به‌هم — متن فارسی در رشته‌ها
  "RUF002",
  "RUF003",
  # N818 پسوند Error را برای نام استثنا الزامی می‌کند. اینجا عمداً رعایت
  # نمی‌شود: `raise NotFound()` و `raise PermissionDenied()` در محل
  # فراخوانی روان‌تر از `NotFoundError` خوانده می‌شوند، و این نام‌ها با
  # کدهای خطای §5.1 یکی هستند.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/silp/scripts/*" = ["T201"]          # اسکریپت‌ها به stdout می‌نویسند
"src/silp/db/migrations/**" = ["E501", "N999", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["silp"]

# ── mypy ───────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["silp.db.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["arq.*", "slugify.*"]
ignore_missing_imports = true

# ── pytest ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-q",
  "--strict-markers",
  "--cov=silp.domain",
  "--cov=silp.services",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
markers = [
  "integration: نیازمند PostgreSQL و Redis واقعی",
]
filterwarnings = ["error::DeprecationWarning:silp.*"]

[tool.coverage.run]
# SQLAlchemy async هر کوئری را داخل یک greenlet اجرا می‌کند. بدون این
# تنظیم، coverage.py ردگیری را در آن جابه‌جایی از دست می‌دهد و خطوطی
# که مسلماً اجرا شده‌اند «پوشش‌نداده» شمرده می‌شوند.
concurrency = ["greenlet"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
